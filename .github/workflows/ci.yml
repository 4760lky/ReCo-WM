name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile all sources
        run: python -m compileall -q code

  # The regression tests need the pinned CUDA-era PyTorch / TorchRL nightlies; on a CPU runner they are
  # best-effort. Remove `continue-on-error` once a CPU-compatible requirements file exists.
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU PyTorch)
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt || true
      - name: Run tests
        working-directory: code
        run: python -m pytest -q
